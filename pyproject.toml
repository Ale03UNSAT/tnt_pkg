[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tntlib"
version = "0.4.1"
description = "Personal scientific toolkit for data analysis, smoothing, and plotting and symbolic computation"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name = "Alessandro Petrini" }
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "sympy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tntlib*"]


[project.optional-dependencies]
test = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]