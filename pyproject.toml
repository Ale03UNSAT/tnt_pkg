[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tntlib"
version = "0.3.0"
description = "Personal scientific toolkit for data analysis, smoothing, and plotting"
readme = "README.md"
requires-python = ">=3.8"

authors = [
  { name = "Alessandro Petrini" }
]

dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tntlib*"]